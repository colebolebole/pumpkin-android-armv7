name: Build Android armv7

on:
  workflow_dispatch:
    inputs:
      pumpkin_commit:
        description: Full 40-character Pumpkin commit to build (leave empty to use the commit pinned in build.ps1)
        required: false
        default: ''
      release_tag:
        description: Publish a GitHub release with this tag (e.g. v0.2.3). Leave empty to only build.
        required: false
        default: ''
      lto:
        description: Link-time optimization (default = Pumpkin's own profile, i.e. fat LTO)
        type: choice
        options: [default, fat, thin, 'off']
        default: default
      jobs:
        description: Maximum parallel rustc jobs (0 = cargo default). Fewer jobs lowers peak memory but is slower.
        required: false
        default: '0'
      strip:
        description: Symbol stripping (default = Pumpkin's profile; symbols = much smaller binary)
        type: choice
        options: [default, none, debuginfo, symbols]
        default: default
      data_opt_level:
        description: opt-level for the pumpkin-data crate only (it is the build's memory peak)
        type: choice
        options: [default, '0', '1', '2', '3', s, z]
        default: default
      data_codegen_units:
        description: codegen-units for the pumpkin-data crate only (0 = Pumpkin's default)
        required: false
        default: '0'
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}-${{ inputs.lto || 'default' }}-${{ inputs.jobs || '0' }}-${{ inputs.strip || 'default' }}-${{ inputs.data_opt_level || 'default' }}-${{ inputs.data_codegen_units || '0' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build pumpkin (armv7-linux-androideabi, API 21)
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      pumpkin_commit: ${{ steps.info.outputs.pumpkin_commit }}
      sha256: ${{ steps.info.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      # Pumpkin tracks stable Rust (rust-toolchain.toml), and the runner image can lag behind.
      - name: Update Rust
        shell: powershell
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      # The Android NDK is ~745 MB to download and ~3.5 GB extracted; build.ps1 skips both when it is present.
      - name: Restore Android NDK cache
        uses: actions/cache@v4
        with:
          path: work/android-ndk
          key: android-ndk-r27c-windows

      - name: Build
        shell: powershell
        env:
          PUMPKIN_COMMIT: ${{ inputs.pumpkin_commit }}
          LTO: ${{ inputs.lto || 'default' }}
          JOBS: ${{ inputs.jobs || '0' }}
          STRIP: ${{ inputs.strip || 'default' }}
          DATA_OPT: ${{ inputs.data_opt_level || 'default' }}
          DATA_CGU: ${{ inputs.data_codegen_units || '0' }}
        run: |
          $buildArgs = @{}
          if ($env:DATA_CGU -notmatch '^[0-9]{1,3}$') { throw 'data_codegen_units must be a non-negative integer.' }
          $buildArgs['DataCodegenUnits'] = [int]$env:DATA_CGU
          $buildArgs['DataOptLevel'] = $env:DATA_OPT
          if ($env:JOBS -notmatch '^[0-9]{1,2}$') { throw 'jobs must be a small non-negative integer.' }
          $buildArgs['Jobs'] = [int]$env:JOBS
          $buildArgs['Strip'] = $env:STRIP
          if ($env:PUMPKIN_COMMIT) {
            if ($env:PUMPKIN_COMMIT -notmatch '^[0-9a-f]{40}$') {
              throw 'pumpkin_commit must be a full 40-character lowercase hex commit hash.'
            }
            $buildArgs['PumpkinCommit'] = $env:PUMPKIN_COMMIT
          }
          $buildArgs['Lto'] = $env:LTO

          # Sample memory in the background so every run reports its peak usage.
          $peakFile = Join-Path $env:RUNNER_TEMP 'peak.txt'
          $sampler = Start-Job -ArgumentList $peakFile -ScriptBlock {
            param($file)
            $peakProc = 0; $peakSys = 0; $peakOne = 0; $peakCrate = 'none'
            while ($true) {
              $p = (Get-Process rustc, cargo, clang, ld.lld -ErrorAction SilentlyContinue |
                    Measure-Object -Property WorkingSet64 -Sum).Sum
              $os = Get-CimInstance Win32_OperatingSystem
              $sys = ($os.TotalVisibleMemorySize - $os.FreePhysicalMemory) * 1KB
              if ($p -gt $peakProc) { $peakProc = $p }
              if ($sys -gt $peakSys) { $peakSys = $sys }
              # Largest single rustc process and which crate it is compiling.
              foreach ($r in (Get-CimInstance Win32_Process -Filter "Name='rustc.exe'" -ErrorAction SilentlyContinue)) {
                if ($r.WorkingSetSize -gt $peakOne) {
                  $peakOne = $r.WorkingSetSize
                  if ($r.CommandLine -match '--crate-name\s+(\S+)') { $peakCrate = $Matches[1] }
                }
              }
              "$peakProc $peakSys $($os.TotalVisibleMemorySize * 1KB) $peakOne $peakCrate" | Set-Content $file
              Start-Sleep -Seconds 3
            }
          }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          try {
            ./build.ps1 @buildArgs
            $buildExit = $LASTEXITCODE
          } finally {
            $clock.Stop()
            Stop-Job $sampler; Remove-Job $sampler -Force
          }

          if (Test-Path $peakFile) {
            $v = (Get-Content $peakFile) -split ' '
            $gb = { param($b) '{0:N1} GB' -f ([double]$b / 1GB) }
            $lines = @(
              "### Build stats (lto = $env:LTO, jobs = $env:JOBS, strip = $env:STRIP, data opt = $env:DATA_OPT, data cgu = $env:DATA_CGU)",
              "- Build time: $([int]$clock.Elapsed.TotalMinutes) min",
              "- Peak memory of the compiler/linker processes: $(& $gb $v[0])",
              "- Largest single rustc process: $(& $gb $v[3]) (crate: $($v[4]))",
              "- Peak system memory in use: $(& $gb $v[1]) of $(& $gb $v[2])"
            )
            if (Test-Path dist/pumpkin-armv7-android) {
              $lines += "- Binary size: $('{0:N1} MB' -f ((Get-Item dist/pumpkin-armv7-android).Length / 1MB))"
            }
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $lines
          }
          if ($buildExit -ne 0) { exit $buildExit }

      - name: Collect build info
        id: info
        shell: powershell
        run: |
          $commit = (git -C work/Pumpkin rev-parse HEAD).Trim()
          $sha = (Get-FileHash dist/pumpkin-armv7-android -Algorithm SHA256).Hash.ToLower()
          "pumpkin_commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Pumpkin commit: $commit"
          "SHA-256: $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: pumpkin-armv7-android
          path: |
            dist/pumpkin-armv7-android
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pumpkin-armv7-android
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          COMMIT: ${{ needs.build.outputs.pumpkin_commit }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TARGET_SHA: ${{ github.sha }}
          LTO: ${{ inputs.lto || 'default' }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" dist/pumpkin-armv7-android dist/SHA256SUMS.txt --clobber
          else
            cat > notes.md <<EOF
          Unofficial 32-bit ARM Android build of [Pumpkin](https://github.com/Pumpkin-MC/Pumpkin), built by GitHub Actions.

          - **Target:** \`armv7-linux-androideabi\`, built against Android API 21, so it runs on **Android 5.0 and newer**
          - **Built from:** upstream commit [\`${COMMIT:0:7}\`](https://github.com/Pumpkin-MC/Pumpkin/tree/${COMMIT}) plus the \`getifaddrs\` shim in this repo (IPv4 interfaces only)
          - **Link-time optimization:** \`$LTO\` (\`default\` is Pumpkin's own release profile, fat LTO)
          - **Not tested on an Android device yet.** Please report crashes with your device, Android version and output.

          SHA-256: \`${SHA256}\` (also in \`SHA256SUMS.txt\`).
          Licensed GPL-3.0, same as Pumpkin; see the README for the corresponding source.
          EOF
            gh release create "$TAG" dist/pumpkin-armv7-android dist/SHA256SUMS.txt \
              --title "Pumpkin for Android armv7 (Android 5.0+) $TAG" \
              --notes-file notes.md \
              --target "$TARGET_SHA"
          fi
